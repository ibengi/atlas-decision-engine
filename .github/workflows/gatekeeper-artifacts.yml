name: Atlas V2 invariant and image gate
on:
  pull_request:
  push:
    branches: [atlas-v2/rebuild]
permissions:
  contents: read
jobs:
  exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Build isolated runtime with invariants and behavioral mutations
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker build --build-arg RAILWAY_GIT_COMMIT_SHA="$CANDIDATE_SHA" -t atlas-v2:ci .
      - name: Image has exact source and no legacy broker/model code
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker run --rm -e RAILWAY_GIT_COMMIT_SHA="$CANDIDATE_SHA" atlas-v2:ci python -c 'from atlas_v2.service import release_identity; import importlib.util,json; r=release_identity(); assert r["model_approved"] is False; assert all(importlib.util.find_spec(x) is None for x in ("kalshi_client","execution_engine","btc_probability_model","anthropic","openai")); m=json.load(open("mutation_report.json")); assert m["all_killed"]; print(r)'
      - name: A red invariant suite must prevent the image
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -c 'from pathlib import Path; Path("v2/tests/test_ci_red.py").write_text("import unittest\nclass Broken(unittest.TestCase):\n def test_bad(self): self.fail(\"red suite must block image\")\n")'
          if docker build --build-arg RAILWAY_GIT_COMMIT_SHA="$CANDIDATE_SHA" -t atlas-v2:red .; then
            echo 'ERROR: red suite produced an image'
            exit 1
          fi
          rm v2/tests/test_ci_red.py
