name: Alpha Learning v1 validation

on:
  push:
    # AA-18: the workflow only ever ran on the learning branch, so the
    # candidate branch was never exercised by hosted CI and "CI-proven" was a
    # claim about a different commit. The remediation branch is added and the
    # learning branch is PRESERVED.
    branches:
      - alpha/astra-learning-v1
      - alpha/astra-candidate-feed-v2-remediation
      - alpha/astra-candidate-feed-v3-remediation
      - alpha/astra-candidate-feed-v4-remediation
      - alpha/astra-candidate-feed-v5-astra-remediation
  pull_request:
    branches:
      - main
      - alpha/astra-learning-v1
      - alpha/astra-candidate-feed-v2-remediation
      - alpha/astra-candidate-feed-v3-remediation
      - alpha/astra-candidate-feed-v4-remediation
      - alpha/astra-candidate-feed-v5-astra-remediation

jobs:
  test-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Isolate synthetic test transport
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/audit_isolation:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "ATLAS_AUDIT_ALLOW_LOOPBACK=1" >> "$GITHUB_ENV"
          echo "PROBE_PROVIDERS_ON_START=0" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"

      - name: Alpha Learning tests
        run: |
          python -m unittest tests.test_alpha_learning -v
          python -m unittest tests.test_alpha_learning_runtime -v
          python -m unittest tests.test_alpha_resolution_ingest -v
          python -m unittest tests.test_alpha_feed_readiness -v
          python -m unittest tests.test_alpha_candidate_truth -v
          python -m unittest tests.test_research_feed_boundary -v

      # AA-01..AA-18. Every finding reproduced, then closed. Run as its own
      # step so a failure names the remediation rather than being buried in
      # the full-suite output.
      - name: Astra AA-01..AA-18 regression suite
        run: python -m pytest tests/test_astra_aa01_aa18_remediation.py -q

      # The re-audit's eleven remaining findings, each reproduced first.
      # Its own step so a failure names the finding rather than being buried.
      - name: Astra v3 re-audit regression suite
        run: python -m pytest tests/test_astra_v3_remediation.py -q

      # RA-01..RA-15 from the independent counter-audit, each reproduced
      # from its counterexample before it was closed. Its own step so a
      # failure names the finding rather than being buried.
      - name: Astra v4 counter-audit regression suite
        run: python -m pytest tests/test_astra_v4_remediation.py -q

      - name: Astra v5 independent counter-audit regressions
        run: python -m pytest tests/test_astra_v5_*.py -q

      # The classes the counter-audit asked to see run: crash/restart and
      # short/zero/EINTR/EIO writes, the stale-cache multiprocess case, the
      # source-conflict cases, the settlement-binding missing/null matrix,
      # the report-path overwrite matrix, budget-ledger durability, and the
      # observer-blocking cases.
      - name: v4 durability, cache, binding, report-path and observer tests
        run: |
          python -m pytest tests/test_astra_v4_remediation.py -q \
            -k "RA03 or RA04 or RA05 or RA06 or RA08 or RA09 or RA11 or RA14 or RA15"

      # The specific classes the re-audit asked to see run: crash/restart,
      # mixed writers, spool partials and capacity, settlement omission,
      # and the M07P mutation.
      - name: Crash, restart, mixed-writer, spool and settlement tests
        run: |
          python -m pytest tests/test_astra_v3_remediation.py -q \
            -k "AA12 or AA13 or AA13b or AA13c or AA14 or AA11 or AA15 or M07P"

      # AA-17. Effect-based: these are the assertions the two surviving
      # mutations would have defeated.
      - name: Mutation regression (effect, not counters)
        run: python -m pytest tests/test_astra_mutation_regression.py -q

      # Structured phases and invariant-specific semantic assertions decide
      # kills. Redundant diagnostic mutations remain honestly diagnostic.
      - name: Mutation probe (zero unresolved effective safety mutations)
        run: |
          python tools/astra_mutation_probe.py --json > mutation-probe.json
          python - <<'PY'
          import json
          summary = json.load(open('mutation-probe.json', encoding='utf-8'))
          assert summary['surviving_effective_safety_mutations'] == 0, summary
          assert summary['unresolved_effective_safety_mutations'] == 0, summary
          assert summary['inconclusive'] == 0, summary
          assert summary['not_applied'] == 0, summary
          assert summary['kills_with_setup_errors'] == 0, summary
          assert summary['gate_passed'] is True, summary
          print('%d behavioral kills; %d diagnostic controls; 0 unresolved'
                % (summary['behavioural_kills'], summary['diagnostic_only']))
          PY

      # AA-02. The strict shared contract, on its own.
      - name: Strict contract, crash and concurrency tests
        run: |
          python -m pytest tests/test_astra_aa01_aa18_remediation.py -q \
            -k "AA02 or AA12 or AA13 or AA14"

      - name: Full repository test suite
        run: python -m pytest tests/ -q

      - name: Safety boundary
        run: |
          python - <<'PY'
          import ast, pathlib
          files = [
              pathlib.Path('candidate_contract.py'),
              pathlib.Path('research_spool.py'),
              pathlib.Path('durable_append.py'),
              pathlib.Path('source_identity.py'),
              pathlib.Path('alpha_persistence_paths.py'),
              pathlib.Path('alpha_settlement_validation.py'),
              pathlib.Path('alpha_learning.py'),
              pathlib.Path('alpha_learning_runtime.py'),
              pathlib.Path('alpha_resolution_ingest.py'),
              pathlib.Path('alpha_feed_readiness.py'),
              pathlib.Path('alpha_consumer.py'),
              pathlib.Path('research_feed.py'),
              pathlib.Path('alpha_service.py'),
              pathlib.Path('tools/alpha_learning_report.py'),
              pathlib.Path('tools/alpha_resolution_ingest.py'),
              pathlib.Path('tools/alpha_feed_readiness.py'),
          ]
          banned = {
              'order_manager','execution_engine','kalshi_client','risk_manager',
              'position_sizer','trade_logger','position_manager','state_restore',
              'equity_ledger','kalshi_alpha_bot'
          }
          violations = {}
          for p in files:
              tree = ast.parse(p.read_text())
              imported = set()
              for n in ast.walk(tree):
                  if isinstance(n, ast.Import):
                      imported.update(a.name.split('.')[0] for a in n.names)
                  elif isinstance(n, ast.ImportFrom) and n.module:
                      imported.add(n.module.split('.')[0])
              hit = sorted(imported & banned)
              if hit:
                  violations[str(p)] = hit
          assert not violations, violations
          print('SHADOW boundary PASS:', ', '.join(str(p) for p in files))
          PY

      - name: Durable report and memory CLI smoke test
        run: |
          tmpdir="$(mktemp -d)"
          export DATA_DIR="$tmpdir"
          python tools/alpha_learning_report.py --memory-only --market-class macro --limit 3 > "$tmpdir/memory.json"
          python - <<'PY'
          import json, os
          p = os.path.join(os.environ['DATA_DIR'], 'memory.json')
          obj = json.load(open(p, encoding='utf-8'))
          assert obj['purpose'] == 'forecast_calibration_memory', obj
          assert obj['market_class'] == 'macro', obj
          assert isinstance(obj['cases'], list), obj
          print('memory CLI PASS')
          PY
          python tools/alpha_learning_report.py > "$tmpdir/stdout-report.json"
          python - <<'PY'
          import json, os
          d = os.environ['DATA_DIR']
          persisted = os.path.join(d, 'alpha_learning_report.json')
          assert os.path.exists(persisted), persisted
          obj = json.load(open(persisted, encoding='utf-8'))
          assert obj['mode'] == 'SHADOW_ONLY', obj
          assert obj['broker_authority'] is False, obj
          assert obj['learning_version'] == 'astra-alpha-learning-v1', obj
          assert isinstance(obj.get('selected_memory'), list), obj
          leftovers = [x for x in os.listdir(d) if x.startswith('.alpha-learning-')]
          assert not leftovers, leftovers
          print('durable report CLI PASS')
          PY

      # AA-15 (re-audit): the CLI now requires the operator to NAME the
      # settlement authority they verified, and the settlement to carry the
      # COMPLETE binding. Both halves are exercised, including the refusal.
      #
      # RA-11/RA-12: "complete" now means the full VERSIONED identity -- the
      # environment and the contract version too -- plus the actual
      # resolution instant and the settlement evidence identity, and
      # qualification RECOMPUTES the source digest from the evidence the
      # prediction retained. So the fixture is built by the PRODUCTION
      # producer and `source_binding_for`, not by hand: a synthetic digest
      # cannot be re-derived from anything, and this step is exactly where a
      # library/CLI divergence has to be caught.
      - name: Resolution ingest CLI boundary smoke test
        run: |
          tmpdir="$(mktemp -d)"
          export DATA_DIR="$tmpdir"
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from alpha_ledger import AlphaLedger
          from alpha_consumer import SpoolConsumer
          from alpha_service import source_binding_for
          from research_feed import ResearchFeed, candidate_from_market

          now = datetime(2025, 1, 1, 10, tzinfo=timezone.utc)
          market = {
              'ticker': 'KX-CI', 'event_ticker': 'KX-CI-EV',
              'title': 'Will the CI step pass?',
              'rules_primary': 'Settles to the CI log.',
              'settlement_sources': [{'name': 'CI Reference Rate'}],
              'volume': 10, 'open_interest': 20,
              'close_time': (now + timedelta(hours=3)).isoformat(
                  timespec='seconds'),
              'expiration_time': (now + timedelta(hours=4)).isoformat(
                  timespec='seconds'),
              'yes_bid': 44, 'yes_ask': 46, 'no_bid': 54, 'no_ask': 56,
          }
          feed = ResearchFeed(start_writer=False)
          record = feed._build(candidate_from_market(
              market, {}, raw_book=market, cycle_id='ci',
              observed_at_utc=now.isoformat()))
          assert record is not None, feed.last_errors
          snapshot = SpoolConsumer.mint(None, record)
          binding = source_binding_for(record, contract_id=snapshot.contract_id,
                                       market_snapshot_id=snapshot.market_snapshot_id,
                                       digest_verified=True, snapshot=snapshot)
          AlphaLedger().record_prediction({
              'prediction_id': 'ci-p1',
              'contract_id': 'KX-CI',
              'market_snapshot_id': snapshot.market_snapshot_id,
              'snapshot': snapshot.as_dict(),
              'prediction_time': (now + timedelta(minutes=1)).isoformat(),
              'source_binding': binding})
          row = {'prediction_id': 'ci-p1', 'outcome': 1,
                 'source': 'ci-trusted-feed',
                 'resolved_at': '2025-01-01T14:00:00+00:00',
                 'settlement_evidence_id': 'ci-settlement-0001',
                 'contract_id': binding['contract_id'],
                 'market_snapshot_id': binding['market_snapshot_id'],
                 'source_record_sha256': binding['record_sha256'],
                 'environment': binding['environment'],
                 'contract_schema': binding['contract_schema']}
          with open(os.path.join(os.environ['DATA_DIR'],
                                 'settlements.jsonl'), 'w',
                    encoding='utf-8') as fh:
              fh.write(json.dumps(row) + '\n')
          # RA-11: the same settlement with the environment removed must be
          # QUARANTINED, not resolved on the fields it happens to carry.
          partial = {k: v for k, v in row.items() if k != 'environment'}
          with open(os.path.join(os.environ['DATA_DIR'],
                                 'partial.jsonl'), 'w',
                    encoding='utf-8') as fh:
              fh.write(json.dumps(partial) + '\n')
          print('CI settlement fixture built from the production producer')
          PY
          # RA-11: an INCOMPLETE versioned binding is quarantined.
          set +e
          python tools/alpha_resolution_ingest.py --input "$tmpdir/partial.jsonl" \
            --strict --trusted-source ci-trusted-feed > "$tmpdir/partial.json"
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json, os
          from alpha_ledger import AlphaLedger
          out = json.load(open(os.path.join(os.environ['DATA_DIR'],
                                            'partial.json'), encoding='utf-8'))
          assert out['appended'] == 0, out
          assert len(out['quarantined']) == 1, out
          assert 'environment' in json.dumps(out['quarantined']), out
          assert AlphaLedger().find_resolution('ci-p1') is None, 'it resolved'
          print('incomplete versioned binding QUARANTINED, as designed')
          PY
          # An unqualified source is refused. This is the DEFAULT, so it is
          # asserted before the happy path rather than after it.
          set +e
          python tools/alpha_resolution_ingest.py --input "$tmpdir/settlements.jsonl" \
            --strict --trusted-source some-unverified-blog > "$tmpdir/refused.json"
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json, os
          from alpha_ledger import AlphaLedger
          refused = json.load(open(os.path.join(os.environ['DATA_DIR'],
                                                'refused.json'), encoding='utf-8'))
          assert refused['appended'] == 0, refused
          assert AlphaLedger().find_resolution('ci-p1') is None, 'it resolved anyway'
          print('unqualified settlement source REFUSED, as designed')
          PY
          python tools/alpha_resolution_ingest.py --input "$tmpdir/settlements.jsonl" \
            --strict --trusted-source ci-trusted-feed > "$tmpdir/ingest.json"
          python - <<'PY'
          import json, os
          from alpha_ledger import AlphaLedger
          d = os.environ['DATA_DIR']
          result = json.load(open(os.path.join(d, 'ingest.json'), encoding='utf-8'))
          assert result['mode'] == 'SHADOW_ONLY', result
          assert result['broker_authority'] is False, result
          assert result['appended'] == 1, result
          assert result['trusted_sources_enforced'] is True, result
          assert result['quarantined'] == [], result
          assert result['evidence_unverified'] == [], result
          resolution = AlphaLedger().find_resolution('ci-p1')
          assert resolution and resolution['actual_outcome'] == 1, resolution
          # The trust decision travels with the outcome (correction 12).
          assert resolution['binding_verified'] is True, resolution
          assert resolution['source_trusted'] is True, resolution
          # RA-11: the ACTUAL resolution instant, not the ingestion time.
          assert resolution['resolved_at'] == '2025-01-01T14:00:00+00:00', resolution
          assert resolution['settlement_evidence_id'] == 'ci-settlement-0001', resolution
          # RA-12: the evidence was independently recomputed.
          assert resolution['source_evidence_verified'] is True, resolution
          # RA-13: and this outcome is admissible in learning.
          qualified = AlphaLedger().qualified_resolved()
          assert len(qualified) == 1, qualified
          assert qualified[0]['settlement_qualified'] is True, qualified
          print('resolution ingest CLI PASS')
          PY

      - name: Feed readiness CLI fails closed
        run: |
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/partial.json" <<'EOF'
          {"rows":[{"recorded_at":"2026-09-11T11:00:00+00:00","decision":{"ticker":"KX-CI","entry_ask":76,"spread":1,"model_output":{"features":{"minutes_remaining":12}}}}]}
          EOF
          set +e
          python tools/alpha_feed_readiness.py --input "$tmpdir/partial.json" > "$tmpdir/readiness.json"
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json, os
          p = os.path.join(os.environ.get('TMPDIR', '/tmp'), 'unused')
          PY
          python - "$tmpdir/readiness.json" <<'PY'
          import json, sys
          obj = json.load(open(sys.argv[1], encoding='utf-8'))
          assert obj['mode'] == 'SHADOW_ONLY', obj
          assert obj['broker_authority'] is False, obj
          assert obj['all_records_ready'] is False, obj
          result = obj['results'][0]
          assert 'yes_bid' in result['missing_fields'], result
          assert 'expected_resolution_time_utc' in result['missing_fields'], result
          assert result['prohibited_inferences'], result
          print('feed readiness CLI fail-closed PASS')
          PY
