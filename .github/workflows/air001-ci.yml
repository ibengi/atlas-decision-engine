# AIR-001 Wave 1 (DE-P0-001 / SYS-P1-001): one commit → one reproducible,
# gated artifact. The canonical gate is the repo's own run_tests.py; the
# pytest pass proves runner independence; the artifact hash and SBOM give
# the certification manifest (Wave 8) its bindings.
name: air001-ci
on:
  push:
    branches: ["main", "air001/**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install pytest
      - name: Compile
        run: python -m compileall -q .
      - name: Canonical test gate (unittest runner)
        run: python run_tests.py
      - name: Runner-independence gate (pytest)
        run: python -m pytest tests/ -q
      - name: Static checks
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 .
      - name: Source artifact hash
        run: |
          git archive --format=tar HEAD | sha256sum | tee source-artifact.sha256
          echo "tree=$(git rev-parse HEAD^{tree})" | tee -a source-artifact.sha256
      - name: SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.lock -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: air001-attestation
          path: |
            source-artifact.sha256
            sbom.cdx.json
            test_report.json
