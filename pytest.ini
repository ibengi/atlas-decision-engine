# Configuration pytest minimale pour une invocation reproductible.
#
# -p no:logging : plusieurs tests capturent les logs eux-memes (helpers
# _Cap) en lisant les handlers reels ; le plugin logging de pytest les
# remplace et ces tests verraient une sortie vide. La suite reste
# egalement executable telle quelle via unittest :
#   python -m unittest discover -s tests
[pytest]
testpaths = tests
addopts = -p no:logging
